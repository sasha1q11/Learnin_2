<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свежий Путь — единое приложение</title>
<style>
/* =====================================================
   Дизайн-система
   ===================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #16a34a;
  --primary-dark: #15803d;
  --primary-light: #dcfce7;
  --accent: #f59e0b;
  --accent-soft: #fef3c7;
  --text: #1e293b;
  --text-light: #64748b;
  --text-muted: #94a3b8;
  --bg: #ffffff;
  --bg-soft: #f8faf9;
  --bg-gray: #f1f5f3;
  --border: #e2e8f0;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --success-soft: #dcfce7;
  --radius: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
  --shadow: 0 4px 24px -6px rgba(15,23,42,.08);
  --shadow-lg: 0 24px 48px -12px rgba(15,23,42,.16);
  --shadow-glow: 0 12px 32px -8px rgba(22,163,74,.45);
  --ease: cubic-bezier(.4,0,.2,1);
  --ease-bounce: cubic-bezier(.34,1.56,.64,1);
}

html { scroll-behavior: smooth; }
body {
  font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }
.container { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
::selection { background: var(--primary); color: #fff; }

/* =====================================================
   Кнопки
   ===================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 22px; border-radius: 12px;
  font-weight: 700; font-size: 14px; letter-spacing: .01em;
  transition: all .25s var(--ease); white-space: nowrap; position: relative;
}
.btn:active { transform: scale(.97); }
.btn--primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; box-shadow: var(--shadow-glow);
}
.btn--primary:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -10px rgba(22,163,74,.55); }
.btn--outline { background: #fff; border: 2px solid var(--border); color: var(--text); }
.btn--outline:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
.btn--ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn--ghost:hover { background: var(--bg-gray); border-color: var(--text-muted); }
.btn--lg { padding: 15px 30px; font-size: 15px; border-radius: 14px; }
.btn--full { width: 100%; }
.btn-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px;
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 9px; font-size: 14px; transition: all .2s var(--ease);
}
.btn-icon:hover { background: var(--primary-light); border-color: var(--primary); transform: scale(1.08); }

/* =====================================================
   Экраны (SPA)
   ===================================================== */
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; animation: screenIn .4s var(--ease); }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* =====================================================
   Экран выбора
   ===================================================== */
.chooser {
  min-height: 100vh; display: grid; place-items: center; padding: 40px 20px;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(22,163,74,.16), transparent 60%),
    radial-gradient(600px 400px at 5% 100%, rgba(245,158,11,.12), transparent 60%),
    linear-gradient(160deg, #f6fcf7 0%, #eef5f0 100%);
  position: relative; overflow: hidden;
}
.chooser::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(15,23,42,.05) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  opacity: .5; pointer-events: none;
}
.chooser__inner { position: relative; width: 100%; max-width: 900px; text-align: center; }
.chooser__logo {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 26px; font-weight: 800; letter-spacing: -.02em;
  margin-bottom: 20px;
}
.chooser__title {
  font-size: clamp(32px, 5vw, 48px); font-weight: 800;
  letter-spacing: -.03em; line-height: 1.1; margin-bottom: 14px;
}
.chooser__title span {
  background: linear-gradient(120deg, var(--primary), var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.chooser__subtitle { color: var(--text-light); font-size: 17px; margin-bottom: 48px; }

.chooser__grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }

.choice {
  display: flex; align-items: flex-start; gap: 20px;
  padding: 30px; border-radius: var(--radius-lg);
  background: rgba(255,255,255,.8);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: var(--shadow);
  text-align: left; cursor: pointer;
  transition: all .35s var(--ease);
  position: relative; overflow: hidden;
}
.choice::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(160deg, transparent 55%, rgba(22,163,74,.08));
  opacity: 0; transition: opacity .35s;
}
.choice:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: transparent; }
.choice:hover::before { opacity: 1; }
.choice__icon {
  font-size: 28px; width: 60px; height: 60px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 18px;
  background: linear-gradient(135deg, var(--primary-light), #ecfdf5);
  box-shadow: inset 0 -3px 0 rgba(22,163,74,.12);
  transition: transform .35s var(--ease-bounce);
}
.choice:hover .choice__icon { transform: scale(1.1) rotate(-6deg); }
.choice__body h3 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 6px; }
.choice__body p { font-size: 14.5px; color: var(--text-light); }
.choice__arrow {
  margin-left: auto; align-self: center; font-size: 22px;
  color: var(--primary); opacity: 0; transform: translateX(-8px);
  transition: all .3s var(--ease);
}
.choice:hover .choice__arrow { opacity: 1; transform: none; }

.chooser__footer { margin-top: 40px; font-size: 13.5px; color: var(--text-muted); }

/* =====================================================
   Хедер
   ===================================================== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.8);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid rgba(226,232,240,.6);
}
.header__inner { display: flex; align-items: center; gap: 32px; height: 76px; }

.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 22px; font-weight: 800; letter-spacing: -.02em;
  cursor: pointer;
}
.logo__icon {
  font-size: 24px; display: grid; place-items: center;
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--primary-light), #bbf7d0);
  box-shadow: inset 0 -2px 0 rgba(22,163,74,.15);
}
.logo__text strong { color: var(--primary); }

.nav { display: flex; gap: 6px; margin-left: auto; }
.nav__link {
  font-size: 15px; font-weight: 600; color: var(--text-light);
  padding: 8px 14px; border-radius: 10px;
  transition: all .2s var(--ease); cursor: pointer;
}
.nav__link:hover { color: var(--primary); background: var(--primary-light); }

.header__actions { display: flex; gap: 10px; }
.burger { display: none; font-size: 24px; color: var(--text); }

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; color: var(--text-light);
  padding: 8px 14px; border-radius: 10px;
  transition: all .2s var(--ease); cursor: pointer;
}
.back-link:hover { color: var(--primary); background: var(--primary-light); }

/* =====================================================
   Hero
   ===================================================== */
.hero {
  position: relative; overflow: hidden;
  padding: 90px 0 100px;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(22,163,74,.12), transparent 60%),
    radial-gradient(600px 400px at 5% 100%, rgba(245,158,11,.10), transparent 60%),
    linear-gradient(180deg, #fbfdfb 0%, #ffffff 100%);
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(15,23,42,.05) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  opacity: .5; pointer-events: none;
}
.hero__inner {
  position: relative; display: grid;
  grid-template-columns: 1.05fr .95fr; gap: 56px; align-items: center;
}
.hero__title {
  font-size: clamp(38px, 5vw, 60px); line-height: 1.05;
  font-weight: 800; letter-spacing: -.03em; margin-bottom: 24px;
  animation: rise .8s var(--ease) both;
}
.hero__title span {
  background: linear-gradient(120deg, var(--primary), var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__subtitle {
  font-size: 18px; color: var(--text-light);
  max-width: 520px; margin-bottom: 34px;
  animation: rise .8s .1s var(--ease) both;
}
.hero__actions {
  display: flex; gap: 14px; margin-bottom: 48px; flex-wrap: wrap;
  animation: rise .8s .2s var(--ease) both;
}
.hero__stats { display: flex; gap: 44px; animation: rise .8s .3s var(--ease) both; }
.stat__num {
  display: block; font-size: 30px; font-weight: 800; letter-spacing: -.02em;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.stat__label { font-size: 14px; color: var(--text-muted); font-weight: 500; }

.hero__image { position: relative; animation: rise .9s .15s var(--ease) both; }
.hero__image img {
  width: 100%; height: 460px; object-fit: cover;
  border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);
  transform: rotate(1.5deg); transition: transform .5s var(--ease);
}
.hero__image:hover img { transform: rotate(0deg) scale(1.01); }
.hero__image::after {
  content: '🌿 100% свежесть';
  position: absolute; bottom: -18px; left: 24px;
  background: #fff; padding: 12px 20px; border-radius: 14px;
  font-weight: 700; font-size: 14px; box-shadow: var(--shadow-lg);
  animation: float 4s ease-in-out infinite;
}
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* =====================================================
   Секции
   ===================================================== */
.section { padding: 100px 0; }
.section--gray {
  background:
    radial-gradient(600px 300px at 50% 0%, rgba(22,163,74,.06), transparent 70%),
    var(--bg-soft);
}
.section__title {
  font-size: clamp(28px, 4vw, 42px); font-weight: 800;
  text-align: center; letter-spacing: -.03em; margin-bottom: 14px;
}
.section__title::after {
  content: ''; display: block; width: 56px; height: 4px; margin: 16px auto 0;
  border-radius: 4px; background: linear-gradient(90deg, var(--primary), var(--accent));
}
.section__subtitle { text-align: center; color: var(--text-light); font-size: 17px; }

.features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 56px; }
.feature {
  padding: 34px 28px; border-radius: var(--radius-lg);
  background: #fff; border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); transition: all .35s var(--ease);
  position: relative; overflow: hidden;
}
.feature::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(160deg, transparent 55%, rgba(22,163,74,.06));
  opacity: 0; transition: opacity .35s;
}
.feature:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: transparent; }
.feature:hover::before { opacity: 1; }
.feature__icon {
  font-size: 30px; width: 60px; height: 60px;
  display: grid; place-items: center; margin-bottom: 20px;
  border-radius: 18px; background: linear-gradient(135deg, var(--primary-light), #ecfdf5);
  box-shadow: inset 0 -3px 0 rgba(22,163,74,.12);
}
.feature h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; letter-spacing: -.01em; }
.feature p { color: var(--text-light); font-size: 14.5px; }

.categories { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; margin-top: 48px; }
.category {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 28px 12px; border-radius: var(--radius);
  background: #fff; border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); transition: all .3s var(--ease);
  text-align: center; font-size: 13.5px; font-weight: 700; cursor: pointer;
}
.category__img {
  font-size: 34px; width: 64px; height: 64px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--bg-soft); transition: all .3s var(--ease-bounce);
}
.category:hover {
  transform: translateY(-6px); border-color: var(--primary);
  box-shadow: var(--shadow-glow); color: var(--primary);
}
.category:hover .category__img { transform: scale(1.12) rotate(-6deg); background: var(--primary-light); }

.shops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 40px; }
.shop {
  padding: 28px 24px; border-radius: var(--radius-lg);
  background: #fff; border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); transition: all .3s var(--ease);
  position: relative; overflow: hidden;
}
.shop::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--primary), var(--accent));
  transition: width .3s var(--ease);
}
.shop:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.shop:hover::before { width: 6px; }
.shop h3 { color: var(--primary); font-size: 19px; margin-bottom: 8px; letter-spacing: -.01em; }
.shop p { font-size: 14px; color: var(--text-light); }
.shop__time { color: var(--accent) !important; font-weight: 700; margin-top: 6px; }

/* =====================================================
   Футер
   ===================================================== */
.footer {
  background:
    radial-gradient(800px 300px at 20% 0%, rgba(22,163,74,.18), transparent 60%),
    #0c1f12;
  color: #c9d6cc; padding: 72px 0 0;
}
.footer__inner { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 44px; padding-bottom: 44px; }
.footer__col h4 { color: #fff; margin-bottom: 18px; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.footer__col a, .footer__col p { display: block; font-size: 14px; margin-bottom: 10px; opacity: .8; transition: all .2s; cursor: pointer; }
.footer__col a:hover { color: var(--accent); opacity: 1; transform: translateX(3px); }
.footer .logo__text { color: #fff; }
.footer .logo__text strong { color: #4ade80; }
.footer .logo__icon { background: rgba(255,255,255,.08); }
.footer__desc { margin-top: 14px; opacity: .7; max-width: 280px; }
.footer__bottom { border-top: 1px solid rgba(255,255,255,.08); padding: 22px 0; font-size: 13.5px; opacity: .6; }

/* =====================================================
   Авторизация / Регистрация
   ===================================================== */
.auth-page {
  min-height: 100vh;
  display: grid; place-items: center; padding: 40px 20px;
  background:
    radial-gradient(700px 400px at 90% -10%, rgba(22,163,74,.18), transparent 60%),
    radial-gradient(600px 500px at 0% 100%, rgba(245,158,11,.14), transparent 60%),
    linear-gradient(160deg, #f2fbf4 0%, #eef5f0 100%);
}
.auth__card {
  width: 100%; max-width: 460px;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,.7);
  padding: 44px 40px; border-radius: var(--radius-lg);
  box-shadow: 0 30px 60px -20px rgba(15,23,42,.18);
  animation: rise .7s var(--ease) both;
}
.auth__logo { display: flex; justify-content: center; margin-bottom: 26px; }
.auth__title { font-size: 27px; font-weight: 800; text-align: center; letter-spacing: -.02em; margin-bottom: 8px; }
.auth__subtitle { text-align: center; color: var(--text-light); font-size: 14.5px; margin-bottom: 32px; }
.auth__form { display: flex; flex-direction: column; gap: 18px; }
.auth__footer { text-align: center; font-size: 14px; color: var(--text-light); margin-top: 26px; }
.auth__footer a { color: var(--primary); font-weight: 700; cursor: pointer; }
.auth__footer a:hover { text-decoration: underline; }

.form-group { display: flex; flex-direction: column; gap: 7px; }
.form-group label { font-size: 13.5px; font-weight: 700; color: var(--text); }
.form-group input {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid var(--border); border-radius: 12px;
  font-size: 15px; background: #fff; transition: all .2s var(--ease);
}
.form-group input::placeholder { color: var(--text-muted); }
.form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(22,163,74,.12); }
.form-group input.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }
.form-error { color: var(--danger); font-size: 12.5px; font-weight: 600; min-height: 0; }

.password-wrap { position: relative; }
.password-wrap input { padding-right: 46px; }
.toggle-password {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 9px; font-size: 16px; opacity: .6; transition: all .2s;
}
.toggle-password:hover { opacity: 1; background: var(--bg-gray); }

.checkbox { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--text-light); cursor: pointer; }
.checkbox input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); border-radius: 5px; flex-shrink: 0; }
.checkbox a { color: var(--primary); font-weight: 600; }

.form-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.link-small { font-size: 13.5px; color: var(--primary); font-weight: 600; cursor: pointer; }
.link-small:hover { text-decoration: underline; }

/* =====================================================
   Админ-панель
   ===================================================== */
.admin-page { background: var(--bg-soft); }
.admin { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px; flex-shrink: 0;
  background:
    radial-gradient(400px 200px at 0% 0%, rgba(22,163,74,.25), transparent 60%),
    #0c1f12;
  color: #c9d6cc; padding: 26px 18px;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  transition: transform .3s var(--ease);
  z-index: 200;
}
.sidebar__logo { margin-bottom: 34px; padding-left: 8px; }
.sidebar__logo .logo__text { color: #fff; }
.sidebar__logo .logo__text strong { color: #4ade80; }
.sidebar__logo .logo__icon { background: rgba(255,255,255,.1); }

.sidebar__nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sidebar__link {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 11px;
  font-size: 14.5px; font-weight: 600; color: #a7b8ab;
  transition: all .2s var(--ease); cursor: pointer;
}
.sidebar__link span { font-size: 18px; width: 22px; text-align: center; }
.sidebar__link:hover { background: rgba(255,255,255,.06); color: #fff; }
.sidebar__link.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; box-shadow: var(--shadow-glow);
}

.sidebar__footer { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
.user-mini {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 12px; background: rgba(255,255,255,.05);
}
.user-mini__name { font-size: 14px; font-weight: 700; color: #fff; }
.user-mini__role { font-size: 12px; color: var(--text-muted); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; flex-shrink: 0;
  font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--accent));
}
.sidebar .btn--ghost { color: #c9d6cc; border-color: rgba(255,255,255,.15); }
.sidebar .btn--ghost:hover { background: rgba(255,255,255,.08); color: #fff; border-color: transparent; }

.admin__main { flex: 1; min-width: 0; padding: 0 32px 40px; }
.admin__header {
  display: flex; align-items: center; gap: 20px;
  padding: 24px 0 28px; margin-bottom: 8px;
  position: sticky; top: 0; z-index: 10; background: var(--bg-soft);
}
.admin__header .burger { display: none; }
.admin__title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.admin__actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.admin__actions .avatar { box-shadow: var(--shadow); }
.admin__actions .btn--ghost { width: 44px; height: 44px; padding: 0; border-radius: 12px; font-size: 18px; }

.admin-tab { display: none; animation: fade .35s var(--ease); }
.admin-tab.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 26px; }
.card-stat {
  display: flex; align-items: flex-start; gap: 16px;
  padding: 24px; border-radius: var(--radius-lg);
  background: #fff; border: 1px solid var(--border);
  box-shadow: var(--shadow-sm); transition: all .3s var(--ease);
}
.card-stat:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: transparent; }
.card-stat__icon {
  font-size: 22px; width: 48px; height: 48px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 14px;
  background: linear-gradient(135deg, var(--primary-light), #ecfdf5);
}
.card-stat__label { font-size: 13px; color: var(--text-light); font-weight: 600; }
.card-stat__value { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0; }
.card-stat__delta { font-size: 12.5px; font-weight: 700; }
.card-stat__delta.positive { color: var(--primary); }
.card-stat__delta.negative { color: var(--danger); }

.panel {
  background: #fff; border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
}
.panel__header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 22px 26px; border-bottom: 1px solid var(--border);
}
.panel__header h2 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }

.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left; padding: 14px 26px;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--text-muted); background: var(--bg-soft);
}
.table td { padding: 16px 26px; font-size: 14px; border-top: 1px solid var(--border); vertical-align: middle; }
.table tbody tr { transition: background .2s; }
.table tbody tr:hover { background: var(--bg-soft); }
.table td .btn-icon + .btn-icon { margin-left: 6px; }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.badge--success { background: var(--success-soft); color: #15803d; }
.badge--warning { background: var(--accent-soft); color: #b45309; }
.badge--danger { background: var(--danger-soft); color: var(--danger); }

.settings-form { padding: 26px; display: flex; flex-direction: column; gap: 20px; max-width: 520px; }

/* =====================================================
   Адаптив
   ===================================================== */
@media (max-width: 1024px) {
  .features { grid-template-columns: repeat(2, 1fr); }
  .categories { grid-template-columns: repeat(3, 1fr); }
  .shops { grid-template-columns: repeat(2, 1fr); }
  .cards { grid-template-columns: repeat(2, 1fr); }
  .footer__inner { grid-template-columns: 1fr 1fr; }
  .chooser__grid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .nav, .header__actions { display: none; }
  .burger { display: block; margin-left: auto; }
  .hero__inner { grid-template-columns: 1fr; }
  .hero__image { order: -1; }
  .hero__image img { height: 320px; }
  .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); }
  .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
  .admin__header .burger { display: block; }
  .admin__main { padding: 0 18px 30px; }
}
@media (max-width: 560px) {
  .hero { padding: 50px 0 60px; }
  .hero__stats { gap: 28px; flex-wrap: wrap; }
  .features, .categories, .shops, .cards { grid-template-columns: 1fr; }
  .footer__inner { grid-template-columns: 1fr; gap: 30px; }
  .auth__card { padding: 32px 24px; }
  .table th, .table td { padding: 12px 16px; }
  .table { font-size: 13px; }
  .section { padding: 60px 0; }
}
</style>
